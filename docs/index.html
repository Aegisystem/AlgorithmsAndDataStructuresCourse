<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Clases del curso</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Source+Sans+3:wght@400;600;700&display=swap">
<link rel="stylesheet" href="assets/curso.css">
<script src="config.js"></script>
<style>
  body { overflow: auto; font-size: 18px; }
  .wrap { max-width: 920px; margin: 0 auto; padding-block: 48px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 22px; }
  h1 { font-family: var(--font-display); font-size: clamp(32px, 6vw, 52px); line-height: 1.05; margin: 0; text-wrap: balance; }
  .docente { font-family: var(--font-mono); font-size: 14px; color: var(--tle); }

  /* cada módulo es un <details> plegable */
  .module { border-bottom: 1px solid var(--line); }
  .module > summary { list-style: none; cursor: pointer; display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; padding: 14px 0; }
  .module > summary::-webkit-details-marker { display: none; }
  .module > summary::before { content: "▸"; font-size: 20px; color: var(--accent); width: 18px; transition: transform .15s; display: inline-block; }
  .module[open] > summary::before { transform: rotate(90deg); }
  .module > summary:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .module h2 { font-family: var(--font-display); font-size: 28px; margin: 0; }
  .module .range { font-family: var(--font-mono); font-size: 14px; color: var(--muted); }
  .module .state { margin-left: auto; font-family: var(--font-mono); font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--ac); }
  .weeks { display: grid; gap: 10px; padding: 0 0 20px 32px; }

  .week { display: grid; grid-template-columns: 64px 1fr auto; gap: 16px; align-items: center; border: 1px solid var(--line); border-radius: 8px; padding: 14px 20px; background: var(--stage); text-decoration: none; color: var(--ink); }
  a.week:hover { border-color: var(--accent); }
  .week .n { font-family: var(--font-mono); font-size: 26px; color: var(--accent); }
  .week h3 { font-family: var(--font-display); font-size: 22px; margin: 0; }
  .week p { margin: 2px 0 0; color: var(--muted); font-size: 16px; }
  .week .s2 { font-family: var(--font-mono); font-size: 13px; color: var(--muted); text-align: right; }

  /* clases y módulos que todavía no están habilitados: en gris y sin enlace */
  .week.off { background: transparent; border: 1px dashed var(--line); color: var(--muted); }
  .week.off .n { color: var(--muted); }
  .module.off h2 { color: var(--muted); }
  .module.off .state { color: var(--muted); }
  .module.off > summary::before { color: var(--muted); }

  .keys { display: flex; flex-wrap: wrap; gap: 10px 22px; font-size: 16px; color: var(--muted); margin-top: 12px; }
  @media (max-width: 560px) { .weeks { padding-left: 0; } .week { grid-template-columns: 44px 1fr; } .week .s2 { grid-column: 2; text-align: left; } }
</style>
</head>
<body>
<div class="wrap">
  <div>
    <div class="eyebrow">Algoritmia y Estructuras de Datos Avanzadas</div>
    <h1>Clases de teoría</h1>
  </div>
  <div id="modulos"><p class="muted">No se pudo cargar la lista de clases (config.js).</p></div>
  <div class="keys">
    <span><kbd>→</kbd> <kbd>espacio</kbd> avanzar</span><span><kbd>←</kbd> retroceder</span><span><kbd>N</kbd> mostrar u ocultar notas</span>
    <span><kbd>F</kbd> pantalla completa</span><span><kbd>P</kbd> modo presentación</span><span><kbd>?</kbd> ayuda</span>
  </div>
</div>
<script>
(function () {
  const curso = window.CURSO;
  if (!curso) return;
  // con ?docente se ven y se abren todas las clases que tienen material
  const docente = new URLSearchParams(location.search).has("docente");
  const abierta = (c) => c.url && (c.disponible || docente);
  const cont = document.getElementById("modulos");
  cont.innerHTML = "";
  if (docente) cont.insertAdjacentHTML("beforebegin", '<p class="docente">Modo docente: se muestran todas las clases con material.</p>');

  const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  curso.modulos.forEach((m) => {
    const algunaAbierta = m.clases.some(abierta);
    const det = document.createElement("details");
    det.className = "module" + (algunaAbierta ? "" : " off");
    det.open = algunaAbierta;
    let html = '<summary><h2>' + esc(m.nombre) + '</h2><span class="range">' + esc(m.semanas) + '</span><span class="state">' +
      (algunaAbierta ? "disponible" : "en preparación") + '</span></summary><div class="weeks">';
    m.clases.forEach((c) => {
      const num = String(c.semana).padStart(2, "0");
      const inner = '<span class="n">' + num + '</span><div><h3>' + esc(c.titulo) + '</h3><p>' + esc(c.resumen) + '</p></div><span class="s2">S2: ' + esc(c.s2) + '</span>';
      if (abierta(c)) html += '<a class="week" href="' + esc(c.url) + (docente ? "?docente" : "") + '">' + inner + '</a>';
      else html += '<div class="week off" aria-disabled="true">' + inner + '</div>';
    });
    det.innerHTML = html + "</div>";
    cont.append(det);
  });
})();
</script>
</body>
</html>
